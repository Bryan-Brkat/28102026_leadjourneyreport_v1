<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutPerform · Lead Journey Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F8; --ink:#16162A; --ink2:#34334F; --muted:#55546E; --muted2:#8A89A3;
  --line:#E4E3EE; --line2:#EEEDF4; --field:#D6D5E4; --head:#F8F8FB;
  --pri:#4B3FD0; --pri-d:#3B30B8; --pri-dd:#2A2190; --pri-l:#E9E7FB; --pri-ll:#F5F4FE;
  --seg:#E9E8F1; --chip:#EEEDF4; --nav:#16152B;
  --mkt-bg:#EEF3FF; --mkt:#1E3A8A; --sales-bg:#F1F0F6;
  --warn-bg:#FFF7F0; --warn-bd:#F3C9A6; --warn:#9A3412;
  --good:#15803D; --bad:#B91C1C;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--pri-d)} a:hover{color:var(--pri-dd)}
button,select,input{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}

.app{display:flex;min-height:100vh;min-width:1280px}
.sidenav{width:72px;flex-shrink:0;background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;position:sticky;top:0;height:100vh}
.logo{width:40px;height:40px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.navbtn{width:48px;height:48px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.navbtn.on{background:#2C2A4D}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.crumbs{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.brand{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)} .brand b{color:var(--pri)}
.vsep{width:1px;height:20px;background:var(--line)}
.crumbs .cur{font-weight:600;color:var(--ink)}
.top-r{display:flex;align-items:center;gap:12px}
.hqbtn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--pri-l);color:var(--pri-dd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

main{padding:24px 32px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.pagehead h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.pagehead p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted)}
.btn-pri{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--pri);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.btn-pri:hover{background:var(--pri-d)}
.btn-sec{height:44px;padding:0 18px;border:1px solid var(--field);border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.btn-sm{height:32px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-link{height:40px;padding:0 12px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--pri-d);cursor:pointer}

.toolbar{display:flex;align-items:center;justify-content:flex-start;gap:16px 32px;flex-wrap:wrap}
.toggles{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tgl{display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:4px;padding:4px;background:var(--seg);border-radius:12px}
.seg button,.seg a{height:36px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;text-decoration:none;white-space:nowrap}
.seg .on{background:#fff;color:var(--ink);font-weight:700}
.seg.sm{padding:3px;border-radius:10px}
.seg.sm button{height:30px;padding:0 12px;font-size:12px;border-radius:8px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.filters{padding:14px 16px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters select,.filters input{height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0}
.filters input[type=search]{width:220px}
.grow{flex-grow:1}

.sec{overflow:visible}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;min-height:60px}
.sec.open > .sec-head{border-bottom:1px solid var(--line2)}
.sec-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.sec-title h2{margin:0;font-size:16px;font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.sec-ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.min-btn{width:28px;height:28px;flex-shrink:0;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.sec:not(.open) .min-btn svg{transform:rotate(-90deg)}
.sec-body{padding:20px}
.sec-body.flush{padding:0}
.foot{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:14px}
.foot b{color:var(--ink2)}

.chip{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip.lg{font-size:13px;padding:3px 8px;color:var(--ink)}
.pend{display:inline-block;padding:3px 8px;border:1px dashed var(--muted2);border-radius:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.drop{display:inline-block;padding:3px 8px;border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:6px;font-size:11.5px;color:var(--warn);font-weight:600;white-space:nowrap}
.i{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid var(--muted2);color:var(--muted2);font-size:9px;font-weight:700;font-style:normal;align-items:center;justify-content:center;margin-left:5px;vertical-align:1px;flex-shrink:0}
[data-tip]{cursor:help}
#tip{position:fixed;z-index:1000;max-width:320px;background:var(--nav);color:#fff;font-size:12px;line-height:1.5;padding:8px 11px;border-radius:8px;white-space:pre-line;pointer-events:none;display:none;box-shadow:0 8px 24px rgba(22,21,43,.25)}
.dl{font-size:11px;font-weight:700;white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .neu{color:var(--muted)}
.grp-chip{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}

/* Compact tables */
.tbl.cmp th{padding:7px 8px;font-size:10.5px;white-space:normal;min-width:64px;max-width:120px;line-height:1.3}
.tbl.cmp th:first-child{max-width:none}
.tbl.cmp thead tr.grow-r th{padding:6px 4px 0}
.tbl.cmp td{padding:6px 8px;font-size:12.5px;vertical-align:middle;white-space:nowrap}
.tbl.cmp tr.total td{padding-top:7px;padding-bottom:7px}
.c2{display:flex;flex-direction:column;gap:1px;line-height:1.3;min-width:0}
.c2 b{font-weight:700;font-size:12.5px}
.ts1{font-size:12px;color:var(--muted)} .ts1 b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11.5px}
.ts2{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.ts2.num{font-size:10.5px}
.chip.xs{font-size:10.5px;padding:0 5px;border-radius:4px}
.av.sm{width:22px;height:22px;border-radius:11px;font-size:9.5px}
.who{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.caret{width:18px;display:flex;justify-content:center}
.ljt .pend,.ljt .drop,.cmp .pend,.cmp .drop{padding:1px 6px;font-size:10.5px}
.ljt th .hc{align-items:center}
.cmp .repbtn{min-height:0;gap:8px}
.cmp .val{font-size:11.5px}
/* Speed-to-Lead single-line table */
.th2{display:flex;align-items:center;justify-content:center;gap:4px;height:100%;min-height:38px;text-align:center}
.th2 .i{flex:none;margin:0}
.spd .gl{border-left:1px solid var(--line2)}
.spd .dl{font-size:10px;letter-spacing:-.03em}
/* Stage cards grouped by Before / After AI qualifies */
.cgroups{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.cgbox{border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cghead{display:flex;align-items:center;padding:0 2px}
.cgroups .cards{overflow:visible}
.scard .dl{font-size:11px}
/* Multi-select dropdowns */
.msw{position:relative}
.sfilters .msel{height:34px;font-size:12.5px;padding:0 8px;border-radius:8px}
.msw .mspanel{top:calc(100% + 4px);width:auto;min-width:100%;max-width:300px;white-space:nowrap}
.mspanel label.msall{font-weight:700;border-bottom:1px solid var(--line2);border-radius:6px 6px 0 0;margin-bottom:4px;padding-bottom:8px}
.mspanel label.msf{padding-left:6px}
.chip.now{background:#FFF4E5;color:#8A4B00}
.avgrow td{background:#FAFAFD;border-bottom:1px solid var(--line)!important;padding-top:5px!important;padding-bottom:5px!important;font-size:12px}
.bub .l1{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.bub .l1 .dl{font-size:9.5px;letter-spacing:-.03em;font-weight:600}
.bub .ts2 .val{font-size:10.5px}
.tbl.cmp.bub td,.tbl.cmp.bub th{padding-left:5px;padding-right:5px}
.bub .l1{gap:4px}
/* Section filter strip */
.sfilters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;padding:10px 20px;background:var(--head);border-bottom:1px solid var(--line2)}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fll{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;white-space:nowrap}
.sfilters select,.sfilters input{height:34px;padding:0 8px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:12.5px;color:var(--ink)}
.sfilters input[type=search]{width:190px}
.sfilters .seg.sm{background:var(--seg)}
.sfilters .seg.sm button{height:28px}
.sfilters .btn-link{height:34px}
/* Export dialog filters + stage multi-select */
.xgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.xgrid select,.xgrid input{width:100%;height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:13px;color:var(--ink)}
.msel-wrap{position:relative}
.msel{width:100%;height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;text-align:left}
.msel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel.empty-sel{border-color:var(--bad);color:var(--bad)}
.mspanel{position:absolute;left:0;top:44px;z-index:120;width:300px;max-height:340px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(22,21,43,.18);padding:8px}
.mspanel label{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.mspanel label:hover{background:var(--head)}
.mspanel label.msg{font-weight:700;font-size:12px;color:var(--ink2);margin-top:4px}
.mspanel label.msi{padding-left:28px}
.mspanel input{accent-color:var(--pri);width:15px;height:15px;margin:0}
/* Section 1: funnel chart */
.fwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.mxwrap{border-top:1px solid var(--line2);padding-top:18px}
.mx td b{display:block;font-weight:600}
.mx td .mxn{display:block;font-size:9.5px;opacity:.8;margin-top:1px}
.mx tr.mxcount td{background:var(--head);font-weight:700;color:var(--ink)}
.mx tr.mxcount th{font-weight:700;color:var(--ink)}
.fcap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.fgrp{margin:14px 0 4px;display:flex;align-items:center;gap:6px}
.fgrp:first-of-type{margin-top:0}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr) 300px;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line2)}
.flab{display:flex;flex-direction:column;gap:1px}
.snum{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sname{font-size:13px;font-weight:700;display:inline-flex;align-items:center}
.ftrack{display:flex;align-items:center;gap:10px}
.fbarbox{flex:1;height:28px;background:var(--head);border-radius:7px;overflow:hidden}
.fbar{height:100%;border-radius:7px}
.fval{width:64px;font-size:16px;font-weight:800;text-align:right}
.fmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.fmeta > span{white-space:nowrap}
.fmoney{font-size:12px;font-weight:700;color:var(--pri-dd)}
.mx{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.mx th,.mx td{border:1px solid var(--line2);padding:7px 1px;text-align:center}
.mx thead th{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--head)}
.mx th.rl{text-align:left;font-size:11px;font-weight:600;color:var(--ink2);background:var(--head);padding-left:8px;width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx th.corner{width:170px;font-size:10px;text-align:left;padding-left:8px}
.mx td{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-variant-numeric:tabular-nums}
.mx td.eq{color:var(--muted)}
.mx td.na{background:repeating-linear-gradient(135deg,#F4F4F8 0,#F4F4F8 1px,transparent 1px,transparent 7px)}

/* Section 1: stage cards */
.cards{display:grid;gap:8px;overflow-x:auto;padding-bottom:2px}
.scard{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:102px}
.scard .top .snum{letter-spacing:.03em}
.scard.mh{border-color:var(--pri);background:var(--pri-ll)}
.scard .top{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;white-space:nowrap;min-width:0}
.scard .top .snum{flex-shrink:0}

.cgrp{display:flex;align-items:center;gap:8px;padding:0 2px 2px}
.cgrp .cline{flex:1;height:1px;opacity:.2}
.scard .own{font-size:10.5px;font-weight:700;color:var(--pri-d);min-width:0;overflow:hidden;text-overflow:ellipsis}
.scard .nm{font-size:13.5px;font-weight:700;line-height:1.25;min-height:34px}
.scard .big{font-size:21px;font-weight:800;letter-spacing:-.02em}
.scard .hr{height:1px;background:var(--line2);margin:2px 0}
.scard .row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}

/* Section 2 chart */
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.swl{width:14px;height:3px;border-radius:2px;display:inline-block}
.sel-inline{height:34px;padding:0 8px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:12.5px;color:var(--ink)}
svg text{font-family:'Plus Jakarta Sans',sans-serif}

/* Tables */
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1.35;background:var(--head);text-align:left;vertical-align:bottom;white-space:nowrap}
.tbl td{padding:12px 10px;border-top:1px solid var(--line2);vertical-align:top;font-size:13px}
.tbl tr.total td{background:var(--head);border-top:2px solid var(--line);font-weight:700}
.tbl th.ghead{padding:5px 10px;border-radius:6px 6px 0 0;font-size:11px;text-transform:none;letter-spacing:0;background:transparent}
.tbl thead tr.grow-r th{background:#fff;padding:8px 4px 0}
.tbl thead tr.grow-r th > div{padding:5px 10px;border-radius:6px 6px 0 0;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.c{text-align:center}
.num{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.sp7 th{text-align:center;padding:8px 6px}
.sp7 td{text-align:center;padding:9px 6px;font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;vertical-align:middle}
.sp7 td.nm{text-align:left;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;padding-left:20px}
.sp7 td.ix{color:var(--muted2);font-size:11px;width:28px}
.sp7 .gl{border-left:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mut{font-size:11.5px;color:var(--muted)}
.big16{font-size:16px;font-weight:800}
.val{font-size:12.5px;font-weight:700;color:var(--pri-dd)}
.av{width:26px;height:26px;flex-shrink:0;border-radius:13px;background:var(--pri-l);color:var(--pri-dd);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.av.lg{width:34px;height:34px;border-radius:17px;font-size:12px}
.tagbu{display:inline-block;padding:3px 8px;border-radius:6px;background:var(--sales-bg);font-size:12px;font-weight:600;color:var(--ink2);margin:0 4px 4px 0}
.mhlink{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--pri-d)}
.lock{display:inline-flex;align-items:center;gap:4px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line2)}
.pager .pg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.pgbtn{width:36px;height:36px;border:1px solid var(--field);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pgbtn:disabled{opacity:.4;cursor:default}

/* lead table */
.ljt th.fz,.ljt td.fz{position:sticky;z-index:2;background:#fff;overflow:hidden;white-space:normal}
.ljt th.fz{background:var(--head);z-index:3}
.ljt thead tr.grow-r th.fz{background:#fff}
.ljt tr.avgrow td.fz{background:#FAFAFD}
.ljt .fzl{box-shadow:inset -1px 0 0 var(--line)}
.ljt td.fz:first-child,.ljt th.fz:first-child{padding-left:14px}
.tbl.cmp.ljt th{padding:6px 5px;min-width:0}
.tbl.cmp.ljt td{padding:5px 5px}
.ljt .who{font-size:12px}
.ljt .ts1{font-size:11.5px;color:var(--ink)}
.ljt td:last-child .ts2{white-space:normal;max-width:96px}
.ljt th .hide-btn{width:16px;height:16px}
.ljt th{font-size:10px!important}
.ljt th .hc{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.hide-btn{width:20px;height:20px;flex-shrink:0;border:0;border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55}
.hide-btn:hover{opacity:1;background:var(--seg)}
.ljt td.st{min-width:0}
.colpanel-wrap{position:relative}

.repbtn{width:100%;min-height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:10px;color:var(--ink);text-align:left;cursor:pointer}
tr.sel td{background:var(--pri-ll)}

.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hlc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hlc.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.hlc .r{display:flex;align-items:center;gap:10px}
.hlc .v{margin-left:auto;font-size:18px;font-weight:800}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(22,21,43,.38);z-index:90;display:none}
.modal{position:fixed;top:120px;right:32px;width:680px;max-width:calc(100vw - 40px);background:#fff;border-radius:16px;box-shadow:0 20px 48px rgba(22,21,43,.28);z-index:100;display:none;flex-direction:column}
.modal.on,.overlay.on{display:flex}
.overlay.on{display:block}
.mh-h{padding:18px 24px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}

.mbody{padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;font-size:13px;cursor:pointer}
.opt input{width:16px;height:16px;margin-top:2px;accent-color:var(--pri)}
.opt.on{border-color:var(--pri);background:var(--pri-ll)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mgrid label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mgrid select{height:40px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0}
.mask{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--head);border-radius:8px;font-size:13px}

.prev{overflow-x:auto;background:var(--nav);border-radius:8px;padding:10px 12px}

      stIdx.map(function (s) { return cell(c, s, c.base); }).join('') +
      '<td class="num" style="padding-right:20px">' + fDur(stat(cyc)) + '</td></tr>';
    if (open) {
      h += x.leads.slice(0, 5).map(function (L) {
        return '<tr class="sub"><td style="padding-left:50px"><div class="c2"><b>' + L.name + '</b><span class="ts2 num">' + L.phoneMasked + ' · ' + L.src + '</span></div></td>' +
          stIdx.map(function (s) { return '<td>' + stageCell(L, s) + '</td>'; }).join('') +
          '<td style="padding-right:20px"><div class="c2"><b class="num" style="font-weight:600">' + fDur(leadTotal(L)) + '</b><span class="ts2 mut">' + leadStatus(L) + '</span></div></td></tr>';
      }).join('') +
        '<tr class="sub"><td colspan="10" style="padding:8px 20px 8px 50px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="sub">Showing ' + Math.min(5, x.leads.length) + ' of ' + fN(x.leads.length) + ' leads for ' + r.name + '</span><a href="#" data-act="openrep" data-v="' + r.id + '" style="font-size:12.5px;font-weight:700">See all of ' + r.name + '\'s leads</a></div></td></tr>';
    }
    return h;
  }).join('');
  var cycT = []; list.forEach(function (L) { if (inRows[L.rep] && L.ts[9] != null) cycT.push((L.ts[9] - L.ts[3]) / MIN); });
  var total = '<tr class="total"><td style="padding-left:20px">Team total · ' + rows.length + ' reps</td>' +
    stIdx.map(function (s) { return cell(tot, s, tot.base); }).join('') +
    '<td class="num" style="padding-right:20px">' + fDur(stat(cycT)) + '</td></tr>';
  var ctrl = modeSeg + JEXP + '<button class="btn-sm" data-act="collapse-reps">Collapse all</button>';
  var tbl = '<div class="tscroll"><table class="tbl cmp">' + head + '<tbody>' + (rows.length ? body + total : '<tr><td colspan="10" class="empty">No sales reps match the filters</td></tr>') + '</tbody></table></div>';
  return section('journey', 'Lead-level journey', '', ctrl, tbl, true);
}

/* ============================================================
   Innovation Team — breakdown by business unit
   ============================================================ */
function buSection() {
  var F = state.f.bubreak;
  var W = tfWins(F), list = leadsIn(W.ev, F), refList = W.ref ? leadsIn(W.ref, F) : null, isCur = F.count === 'current', sel = effBUs(F);
  var bus = BUS.filter(function (b) { return sel.indexOf(b.id) >= 0; });
  var rows = bus.map(function (b) {
    var ls = list.filter(function (L) { return L.bu === b.id; });
    return { name: b.name, leads: ls, c: compute(ls, W.ev[1], 0), p: refList ? compute(refList.filter(function (L) { return L.bu === b.id; }), W.ref[1], 0) : null };
  });
  if (rows.length > 1) rows.push({ name: bus.length === BUS.length ? 'HQ total' : 'Total', leads: list, c: compute(list, W.ev[1], 0), p: refList ? compute(refList, W.ref[1], 0) : null, tot: true });
  var head = '<thead>' + grpRow([[1, null], [3, 'pre'], [8, 'post'], [1, null]]) + '<tr><th class="bnm">Business unit</th>' +
    STAGES.map(function (_, s) { return '<th>' + stageHeadTip(s) + '</th>'; }).join('') +
    '<th class="bcy"><span' + tipAttr('Average time from Lead In to Sold, and from Lead In to SPA Signed') + '>Avg cycle time<i class="i">i</i></span></th></tr></thead>';
  var body = rows.map(function (x) {
    var c = x.c, p = x.p;
    var cyc1 = [], cyc2 = []; x.leads.forEach(function (L) { if (L.ts[9] != null) cyc1.push((L.ts[9] - L.ts[0]) / MIN); if (L.ts[10] != null) cyc2.push((L.ts[10] - L.ts[0]) / MIN); });
    return '<tr' + (x.tot ? ' class="total"' : '') + '><td class="bnm">' + x.name + '</td>' +
      STAGES.map(function (_, s) {
        var n = isCur ? c.C[s] : c.R[s];
        var h = '<span class="bn">' + fN(n) + '</span>';
        if (p) h += '<span class="bd">' + incrS(n, isCur ? p.C[s] : p.R[s]) + '</span>';
        if (!isCur && s) h += '<span class="bm"' + tipAttr('Share of leads that reached the previous stage') + '>' + pct(c.R[s], c.R[s - 1], 0) + ' of prev.</span>';
        if (s < 10) h += '<span class="bm"' + tipAttr(timeTip()) + '>Avg ' + tis(c, s) + '</span>';
        if (s >= 9) h += '<span class="bv"' + tipAttr('Sum of SPA prices from Mhub') + '>' + fRM(s === 9 ? c.soldVal : c.spaVal) + '</span>';
        return '<td><div class="bc">' + h + '</div></td>';
      }).join('') +
      '<td class="bcy"><div class="bc"><span class="bm">To Sold <b>' + fDur(stat(cyc1)) + '</b></span><span class="bm">To SPA <b>' + fDur(stat(cyc2)) + '</b></span></div></td></tr>';
  }).join('');
  var cap = '<div class="rcap"><span><b>Evaluated period:</b> ' + winLabel(W.ev) + '</span><span><b>Referenced period:</b> ' +
    (W.ref ? winLabel(W.ref) : '<span class="mut">not set. Pick a Referenced End Date above to show increments</span>') + '</span>' +
    '<span class="mut">' + (isCur ? 'Current funnel: open leads in each stage right now' : 'Conversion funnel: leads that reached each stage') + '</span></div>';
  var tbl = cap + '<div class="tscroll"><table class="tbl bub2">' + head + '<tbody>' + body + '</tbody></table></div>';
  return section('bubreak', 'Breakdown by business unit', '', '', tbl, true);
}

/* ============================================================
   Render
   ============================================================ */
function render() {
  var admin = isAdmin(), y = window.scrollY;
  document.getElementById('crumb').textContent = admin ? 'BU Admin' : 'Innovation Team';
  document.getElementById('scope').textContent = admin ? BU[ADMIN_BU].name : 'HQ · All business units';
  document.querySelectorAll('#tabs a').forEach(function (a) { var on = a.dataset.tab === state.tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  var html = funnelSection() + trendSection();
  html += admin ? journeySection() : speedSection() + buSection() + journeySection();
  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('#view [data-ind]').forEach(function (i) { i.indeterminate = true; });
  window.scrollTo(0, y);   // re-drawing never moves the screen
}

/* ============================================================
   Export raw data — its own filters (all multi-select), real CSV download
   ============================================================ */
function tsFmt(ms) {
  if (ms == null) return '';
  var p = P(ms);
  if (state.exp.ts === 'utc') return new Date(ms).toISOString().replace('.000', '');
  if (state.exp.ts === 'dmy') return pad(p.d) + '/' + pad(p.mo + 1) + '/' + p.y + ' ' + pad(p.h) + ':' + pad(p.mi);
  return p.y + '-' + pad(p.mo + 1) + '-' + pad(p.d) + 'T' + pad(p.h) + ':' + pad(p.mi) + ':00+08:00';
}
function exportList() { var E = state.exp.f; return leadsIn(rangeWin(E), E); }
function buildCSV() {
  var rows = [['lead_id', 'lead_name', 'phone', 'sales_rep', 'business_unit', 'deal_source', 'status', 'current_stage']
    .concat(STAGES.map(function (s) { return s.key + '_at'; })).concat(['spa_price_rm', 'mhub_deal_id', 'mhub_url', 'total_cycle_mins'])];
  exportList().forEach(function (L) {
    rows.push([L.id, L.name, state.exp.mask ? L.phoneMasked : L.phone, L.rep ? REP[L.rep].name : '', BU[L.bu].name, L.src, leadStatus(L), STAGES[L.f].name]
      .concat(L.ts.map(tsFmt)).concat([L.spa || '', L.mh || '', L.mh ? 'https://www.mhub.my/' : '', Math.round(leadTotal(L))]));
  });
  return rows;
}
function csvText(rows) { return rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n'); }
function renderModal() {
  var E = state.exp.f, a = 'data-sf="exp"', n = exportList().length;
  var stageCtl = msCtl('exp', 'stage').replace('>Furthest stage<', '>Stages<');
  document.getElementById('modal').innerHTML =
    '<div class="mh-h"><h2 id="export-title">Export raw data</h2>' +
    '<button class="iconbtn" style="width:36px;height:36px;border:0;background:#F4F4F8" data-act="export-close" aria-label="Close">' + ICON.close + '</button></div>' +
    '<div class="mbody"><div class="xgrid">' + rangeCtl(a, E) + (isAdmin() ? '' : msCtl('exp', 'bu')) + msCtl('exp', 'rep') + msCtl('exp', 'src') + msCtl('exp', 'status') + stageCtl +
    fl('Timestamps', '<select data-x="ts">' + opt('iso', 'ISO 8601, MYT', state.exp.ts) + opt('dmy', 'DD/MM/YYYY HH:mm', state.exp.ts) + opt('utc', 'UTC', state.exp.ts) + '</select>') + '</div>' +
    '<label class="mask"><input type="checkbox" data-x="mask"' + (state.exp.mask ? ' checked' : '') + '><span><span style="font-weight:700">Mask phone numbers</span><span style="color:var(--muted)"> · for sharing outside the sales team (PDPA)</span></span></label></div>' +
    '<div class="mfoot"><span class="sub"><b style="color:var(--ink)">' + fN(n) + '</b> leads match · CSV, opens in Excel</span><div style="display:flex;gap:10px"><button class="btn-sec" data-act="export-close">Cancel</button>' +
    '<button class="btn-pri" data-act="export-go"' + (n ? '' : ' disabled style="opacity:.5;cursor:default"') + '><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 21h16"></path></svg>Export</button></div></div>';
  document.querySelectorAll('#modal [data-ind]').forEach(function (i) { i.indeterminate = true; });
}
function modalOn() { return document.getElementById('modal').classList.contains('on'); }
function openModal() { state.ms = null; renderModal(); document.getElementById('modal').classList.add('on'); document.getElementById('overlay').classList.add('on'); }
function closeModal() { if (state.ms && state.ms.indexOf('exp:') === 0) state.ms = null; document.getElementById('modal').classList.remove('on'); document.getElementById('overlay').classList.remove('on'); }
function downloadCSV(rows, name) {
  var blob = new Blob(['﻿' + csvText(rows)], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function doExport() {
  var rows = buildCSV();
  if (rows.length < 2) { toast('No leads match these filters'); return; }
  downloadCSV(rows, 'outperform_lead_journey_' + ymd(NOW).replace(/-/g, '') + '.csv');
  closeModal(); toast('Exported ' + fN(rows.length - 1) + ' leads to CSV');
}
var toastT;
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function () { t.style.display = 'none'; }, 2600); }

/* ============================================================
   Events
   ============================================================ */
function getF(sec) { return sec === 'exp' ? state.exp.f : state.f[sec]; }
function redraw(sec) { if (sec === 'exp') renderModal(); else render(); }
function pruneReps(F) {   // keep the rep selection valid for the business units in view
  if (F.rep == null) return;
  var bus = effBUs(F);
  F.rep = F.rep.filter(function (id) { return REP[id] && REP[id].bus.some(function (b) { return bus.indexOf(b) >= 0; }); });
  if (!F.rep.length) F.rep = null;
}
document.addEventListener('click', function (e) {
  /* close an open multi-select when clicking outside it */
  if (state.ms && !e.target.closest('.msw')) { var sec0 = state.ms.split(':')[0]; state.ms = null; redraw(sec0); if (!e.target.closest('[data-act]')) return; }
  var el = e.target.closest('[data-act]');
  if (!el) { if (state.colPanel && !e.target.closest('.colpanel')) { state.colPanel = false; render(); } return; }
  var a = el.dataset.act, v = el.dataset.v;
  if (a === 'togglecol') return; // handled on change
  if (a !== 'colpanel' && state.colPanel && !el.closest('.colpanel')) state.colPanel = false;
  switch (a) {
    case 'ms': state.ms = state.ms === v ? null : v; redraw(v.split(':')[0]); return;
    case 'scount': state.f[el.dataset.sec].count = v; break;
    case 'fview': state.fview = v; break;
    case 'jmode':
      if (v !== state.jmode) { var sj = el.closest('section'); state.jminH = Math.max(state.jminH, sj ? sj.offsetHeight : 0); }
      state.jmode = v; state.page = 1; break;
    case 'freset': state.f[el.dataset.sec] = freshFor(el.dataset.sec); if (el.dataset.sec === 'journey') { state.page = 1; state.hidden = {}; } break;
    case 'jexport': exportJourney(); return;
    case 'min': var ck = state.tab + ':' + el.dataset.sec; state.collapsed[ck] = !state.collapsed[ck]; break;
    case 'hidecol': state.hidden[el.dataset.col] = true; break;
    case 'colpanel': state.colPanel = !state.colPanel; break;
    case 'showall': state.hidden = {}; break;
    case 'page': state.page += +v; break;
    case 'exp': state.expRep = state.expRep === v ? null : v; break;
    case 'collapse-reps': state.expRep = null; break;
    case 'openrep': e.preventDefault(); state.f.journey.rep = [v]; state.jmode = 'lead'; state.page = 1; break;
    case 'export-open': openModal(); return;
    case 'export-close': closeModal(); return;
    case 'export-go': if (!el.disabled) doExport(); return;
    default: return;
  }
  render();
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.act === 'togglecol') { if (t.checked) delete state.hidden[t.dataset.col]; else state.hidden[t.dataset.col] = true; render(); return; }
  if (t.dataset.ms) {
    var parts = t.dataset.ms.split(':'), sec = parts[0], key = parts[1], F = getF(sec);
    var all = msAll(key, F), cur = F[key] == null ? all.slice() : F[key].slice();
    if (t.dataset.msall) cur = t.checked ? all.slice() : [];
    else if (t.dataset.msg) {
      var gv = t.dataset.msg.split('|').map(function (x) { return msValue(key, x); });
      cur = cur.filter(function (x) { return gv.indexOf(x) < 0; });
      if (t.checked) cur = cur.concat(gv);
    } else {
      var val = msValue(key, t.dataset.msv), i = cur.indexOf(val);
      if (t.checked && i < 0) cur.push(val); if (!t.checked && i >= 0) cur.splice(i, 1);
    }
    msSet(sec, key, cur);
    if (key === 'bu') pruneReps(F);
    if (key === 'cat' && F.src) { F.src = F.src.filter(function (x) { return inSel(F.cat, SRCCAT[x]); }); if (!F.src.length) F.src = null; }
    if (sec === 'journey') state.page = 1;
    redraw(sec); return;
  }
  if (t.dataset.x) { if (t.dataset.x === 'mask') state.exp.mask = t.checked; else state.exp[t.dataset.x] = t.value; renderModal(); return; }
  var sec2 = t.dataset.sf;
  if (sec2) {
    var k = t.dataset.k; if (k === 'q') return;
    var F2 = getF(sec2);
    if (t.type === 'date' && !t.value) {   // a cleared date is ignored, except the Referenced dates of the BU breakdown
      if (sec2 === 'bubreak' && (k === 'refEnd' || k === 'refStart')) F2[k] = '';
      redraw(sec2); return;
    }
    if (k === 'cmp' && t.value === 'flex' && F2.cmp !== 'flex') {   // carry the current windows into the 4 date fields
      var Wd = tfWins(F2); F2.evStart = ymd(Wd.ev[0]); F2.refStart = Wd.ref ? ymd(Wd.ref[0]) : '';
    }
    F2[k] = t.value;
    if (sec2 === 'journey') state.page = 1;
    redraw(sec2);
    return;
  }
  var f = t.dataset.f;
  if (f === 's2from') { var p = state.s2[state.tab]; p[0] = +t.value; if (p[1] <= p[0]) p[1] = p[0] + 1; render(); return; }
  if (f === 's2to') { state.s2[state.tab][1] = +t.value; render(); return; }
});
var qT;
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.k !== 'q' || !t.dataset.sf) return;
  clearTimeout(qT);
  var v = t.value, sec = t.dataset.sf;
  qT = setTimeout(function () {
    state.f[sec].q = v; state.page = 1; render();
    var inp = document.querySelector('[data-sf="' + sec + '"][data-k="q"]');
    if (inp) { inp.focus({ preventScroll: true }); var n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (_) {} }
  }, 300);
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (state.ms) { var s0 = state.ms.split(':')[0]; state.ms = null; redraw(s0); return; }
  closeModal();
  if (state.colPanel) { state.colPanel = false; render(); }
});

/* tooltips */
var tip = document.getElementById('tip'), tipEl = null;
document.addEventListener('mouseover', function (e) {
  var el = e.target.closest('[data-tip]');
  if (el === tipEl) return; tipEl = el;
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; placeTip(e);
});
document.addEventListener('mousemove', function (e) { if (tipEl) placeTip(e); });
function placeTip(e) {
  var r = tip.getBoundingClientRect(), x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('scroll', function () { tip.style.display = 'none'; tipEl = null; }, true);

/* routing */
function route() {
  var h = (location.hash || '#admin').slice(1);
  state.tab = h === 'innov' ? 'innov' : 'admin';
  SECS.map(getF).concat([state.exp.f]).forEach(pruneReps);   // a BU Admin only sees their own BU's reps
  state.colPanel = false; state.page = 1; state.ms = null; state.jminH = 0; closeModal();
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
})();

</script>
